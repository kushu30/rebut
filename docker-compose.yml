services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rebut
      POSTGRES_PASSWORD: rebut
      POSTGRES_DB: rebut
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rebut']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
